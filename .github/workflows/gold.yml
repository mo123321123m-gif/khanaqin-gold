name: Gold Bot
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - run: |
          PRICE=$(curl -s https://api.gold-api.com/price/XAU | grep -o '"price":[0-9.]*' | cut -d: -f2)
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TOKEN }}/sendMessage -d chat_id=@khanaqin_gold_2026 -d text="💰 سعر الذهب: $PRICE
          ⏰ بتوقيت بغداد
          📢 خانقين الذهبي"
